name: One-shot Catalog Compute Dispatch

on:
  schedule:
    - cron: '21 6 12 9 *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch Catalog Compute on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compute.yml --ref main
